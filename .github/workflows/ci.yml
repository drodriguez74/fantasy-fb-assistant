name: CI

# Runs the backend tests and the frontend lint, tests and build on every
# push to any branch (which covers pull requests from this repo). Render
# deploys main only after these checks pass (render.yaml:
# autoDeployTrigger: checksPass).
on:
  push:
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      # Settings needs these at import; tests use their own SQLite file
      # (tests/conftest.py) and never open this URL.
      SECRET_KEY: ci-only-not-a-real-secret
      DATABASE_URL: sqlite:///./ci_unused.db
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
