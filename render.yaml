# Render Blueprint for the Fantasy Football Assistant backend.
# New > Blueprint > connect this repo; Render reads this file.
# Secret values are set in the dashboard (sync: false) — copy them from
# backend/.env. Do NOT put secrets in this file.
services:
  - type: web
    name: fantasy-fb-assistant-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    # Deploy only after the CI workflow (.github/workflows/ci.yml) passes on
    # main, so a commit that fails the tests never reaches production.
    autoDeployTrigger: checksPass
    # Only redeploy (and restart) the API when backend files change; a
    # frontend-only push (Vercel) used to restart it and make the next page
    # load wait. Takes effect once Render syncs this Blueprint.
    buildFilter:
      paths:
        - backend/**
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ODDS_API_KEY
        sync: false
      # Sportsbooks the founder can bet at (Florida: Hard Rock Bet only); the
      # app defaults to this too (config.BETTING_MY_BOOKS).
      - key: BETTING_MY_BOOKS
        value: hardrockbet
      # Who may create an account (comma-separated emails, or "*" for anyone).
      # Unset = registration closed, which is the default: a new account can
      # call the AI and vision endpoints and upload the shared Betr board.
      - key: REGISTRATION_ALLOWED_EMAILS
        sync: false
      # Extra accounts allowed to replace the shared Betr board (emails, or
      # "*"). Unset = the owner account only.
      - key: BOARD_UPLOAD_EMAILS
        sync: false
      - key: CORS_ORIGINS
        value: https://fantasy-fb-assistant.vercel.app,http://localhost:3001,http://127.0.0.1:3001
      - key: YAHOO_CLIENT_ID
        sync: false
      - key: YAHOO_CLIENT_SECRET
        sync: false
      - key: YAHOO_REDIRECT_URI
        value: https://fantasy-fb-assistant.vercel.app/yahoo/callback
      # Shared secret for POST /notifications/generate-weekly-digest --
      # must match the DIGEST_CRON_SECRET repository secret set in
      # GitHub Actions (see .github/workflows/weekly-digest.yml). Generate
      # a real random value once (e.g. `openssl rand -hex 32`) and set the
      # same value in both places.
      - key: DIGEST_CRON_SECRET
        sync: false
